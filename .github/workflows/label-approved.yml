name: Label Approved

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write

jobs:
  label-approved:
    runs-on: ubuntu-latest
    steps:
      - name: Run label-approved
        uses: khulnasoft/actions/label-approved@label-approved/v0.1.0 # zizmor: ignore[unpinned-uses]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          debug: "true"
