name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pip-audit:
    name: pip-audit (${{ matrix.action }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        action: [issue-manager, label-approved, latest-changes]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit Python dependencies
        env:
          ACTION: ${{ matrix.action }}
        run: |
          set +e
          pip-audit \
            -r "$ACTION/requirements.txt" \
            -r "$ACTION/requirements-test.txt" \
            --vulnerability-service osv \
            -f json \
            -o "pip-audit-$ACTION.json"
          STATUS=$?
          set -e
          if [ ! -f "pip-audit-$ACTION.json" ]; then
            echo "pip-audit failed without producing a report (exit $STATUS)" >&2
            exit 1
          fi
          # Exit 1 means vulnerabilities were found; that is report-only here.
          python scripts/security_findings.py pip-audit \
            "pip-audit-$ACTION.json" "findings-pip-audit-$ACTION.md" \
            --name "$ACTION" >> "$GITHUB_OUTPUT"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-pip-audit-${{ matrix.action }}
          path: |
            pip-audit-${{ matrix.action }}.json
            findings-pip-audit-${{ matrix.action }}.md
          if-no-files-found: ignore
          retention-days: 30

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl -sSfL "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan git history for secrets
        run: |
          set +e
          ./gitleaks git . --redact \
            --report-format sarif --report-path gitleaks.sarif
          STATUS=$?
          set -e
          if [ ! -f gitleaks.sarif ]; then
            echo "gitleaks failed without producing a report (exit $STATUS)" >&2
            exit 1
          fi
          # Exit 1 means leaks were found; that is report-only here.
          python scripts/security_findings.py gitleaks \
            gitleaks.sarif findings-gitleaks.md >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-gitleaks
          path: |
            gitleaks.sarif
            findings-gitleaks.md
          if-no-files-found: ignore
          retention-days: 30

  zizmor:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install zizmor
        run: python -m pip install "zizmor==1.33.1"

      - name: Audit workflows
        run: |
          set +e
          zizmor --format sarif .github/workflows > zizmor.sarif
          STATUS=$?
          set -e
          if [ ! -s zizmor.sarif ]; then
            echo "zizmor failed without producing a report (exit $STATUS)" >&2
            exit 1
          fi
          zizmor --format plain --min-severity medium .github/workflows || true
          python scripts/security_findings.py zizmor \
            zizmor.sarif findings-zizmor.md >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: >-
          always() && hashFiles('zizmor.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-zizmor
          path: |
            zizmor.sarif
            findings-zizmor.md
          if-no-files-found: ignore
          retention-days: 30

  trivy-config:
    name: Container config scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload SARIF to code scanning
        if: >-
          always() && hashFiles('trivy-config.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Summarize findings
        if: hashFiles('trivy-config.sarif') != ''
        run: |
          python scripts/security_findings.py trivy \
            trivy-config.sarif findings-trivy-config.md >> "$GITHUB_OUTPUT"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-trivy-config
          path: |
            trivy-config.sarif
            findings-trivy-config.md
          if-no-files-found: ignore
          retention-days: 30

  image-scan:
    name: Image vuln scan & SBOM (${{ matrix.action }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        action: [issue-manager, label-approved, latest-changes]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c23212 # v3.10.0

      - name: Build runtime image
        env:
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          docker buildx build --load \
            -f "$ACTION/base.dockerfile" \
            -t "security-scan-$ACTION:latest" \
            "$ACTION"

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: security-scan-${{ matrix.action }}:latest
          format: sarif
          output: trivy-image-${{ matrix.action }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-image-${{ matrix.action }}.sarif
          category: trivy-image

      - name: Summarize findings
        if: hashFiles(format('trivy-image-{0}.sarif', matrix.action)) != ''
        run: |
          python scripts/security_findings.py trivy \
            "trivy-image-${{ matrix.action }}.sarif" \
            "findings-trivy-image-${{ matrix.action }}.md" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        env:
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz" -o syft.tar.gz
          curl -sSfL "https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_checksums.txt" -o syft-checksums.txt
          grep "syft_1.57.2_linux_amd64.tar.gz" syft-checksums.txt | sha256sum -c -
          tar -xzf syft.tar.gz syft
          ./syft "docker:security-scan-$ACTION:latest" -o spdx-json > "sbom-$ACTION.spdx.json"
          python scripts/security_findings.py sbom \
            "sbom-$ACTION.spdx.json" "findings-sbom-$ACTION.md" \
            --name "$ACTION" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM and scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-image-${{ matrix.action }}
          path: |
            trivy-image-${{ matrix.action }}.sarif
            findings-trivy-image-${{ matrix.action }}.md
            sbom-${{ matrix.action }}.spdx.json
            findings-sbom-${{ matrix.action }}.md
          if-no-files-found: ignore
          retention-days: 90

  report:
    name: Report security findings
    needs: [pip-audit, gitleaks, zizmor, trivy-config, image-scan]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download findings artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      - name: File deduplicated security issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -d findings ] || [ -z "$(ls -A findings 2>/dev/null)" ]; then
            echo "No findings artifacts; nothing to report."
            exit 0
          fi
          for f in findings/findings-*.md; do
            [ -e "$f" ] || continue
            src=$(basename "$f" .md | sed 's/^findings-//')
            python scripts/security_issue.py \
              --source "$src" \
              --title "Security findings: $src" \
              --body-file "$f" \
              --run-url "$RUN_URL"
          done
