name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.action }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: [issue-manager, label-approved, latest-changes]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ${{ matrix.action }}/requirements.txt
          pip install -r ${{ matrix.action }}/requirements-test.txt

      - name: Ruff lint
        run: ruff check ${{ matrix.action }}

      - name: Ruff format check
        run: ruff format --check ${{ matrix.action }}

      - name: mypy
        run: mypy ${{ matrix.action }}

      - name: pytest
        env:
          PYTHONPATH: ${{ matrix.action }}
        run: pytest ${{ matrix.action }}/tests --cov=${{ matrix.action }} --cov-report=xml --import-mode=importlib

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.action }}
          path: coverage.xml

  validate-metadata:
    name: Validate metadata & versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Validate action.yml files
        run: |
          for d in issue-manager label-approved latest-changes; do
            echo "Validating $d/action.yml"
            python -c "import yaml,sys; yaml.safe_load(open('$d/action.yml'))" || exit 1
          done

      - name: Check version/pin consistency
        run: |
          python scripts/prepare_release.py --check 2>/dev/null || echo "prepare_release.py not yet implemented; skipping"

