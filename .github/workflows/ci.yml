name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected actions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected actions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            MATRIX=$(git ls-files | python scripts/affected_actions.py)
          else
            MATRIX=$(git diff --name-only --no-renames "$BASE"...HEAD | python scripts/affected_actions.py)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    name: Lint & Test (${{ matrix.action }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        env:
          ACTION: ${{ matrix.action }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r "$ACTION/requirements.txt"
          pip install -r "$ACTION/requirements-test.txt"

      - name: Ruff lint
        env:
          ACTION: ${{ matrix.action }}
        run: ruff check "$ACTION"

      - name: Ruff format check
        env:
          ACTION: ${{ matrix.action }}
        run: ruff format --check "$ACTION"

      - name: mypy
        env:
          ACTION: ${{ matrix.action }}
        run: mypy "$ACTION"

      - name: pytest
        env:
          ACTION: ${{ matrix.action }}
          PYTHONPATH: ${{ matrix.action }}
        run: pytest "$ACTION/tests" --cov="$ACTION" --cov-report=xml --import-mode=importlib

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.action }}
          path: coverage.xml

  validate-metadata:
    name: Validate metadata & versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate action.yml files
        run: python scripts/validate_metadata.py

      - name: Check version/pin/ref consistency
        run: python scripts/prepare_release.py check

      - name: Run repository tests
        run: python -m pytest tests/ -q
