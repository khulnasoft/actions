name: Publish Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to release"
        required: true
        type: choice
        options:
          - issue-manager
          - label-approved
          - latest-changes
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      action: ${{ steps.prepare.outputs.action }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # zizmor: ignore[artipacked]  # credentials required to push

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Prepare release
        id: prepare
        env:
          ACTION: ${{ inputs.action }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python scripts/prepare_release.py prepare --action "$ACTION" --bump "$BUMP"
          VERSION=$(python scripts/prepare_release.py current --action "$ACTION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Validate
        env:
          ACTION: ${{ inputs.action }}
        run: python scripts/prepare_release.py check --action "$ACTION"

      - name: Commit changes
        id: commit
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ACTION/version.txt" "$ACTION/Dockerfile" "$ACTION/README.md" README.md
          git commit -m "chore($ACTION): release v$VERSION"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build & publish image
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c23212 # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./${{ needs.prepare.outputs.action }}
          file: ./${{ needs.prepare.outputs.action }}/base.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            khulnasoft/actions-${{ needs.prepare.outputs.action }}:${{ needs.prepare.outputs.version }}
            ghcr.io/khulnasoft/actions/${{ needs.prepare.outputs.action }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate SBOM for published image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/khulnasoft/actions/${{ needs.prepare.outputs.action }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ needs.prepare.outputs.action }}.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/khulnasoft/actions/${{ needs.prepare.outputs.action }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/khulnasoft/actions-${{ needs.prepare.outputs.action }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-${{ needs.prepare.outputs.action }}.spdx.json

      - name: Create release manifest
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/release_manifest.py \
            --action "$ACTION" --version "$VERSION" --commit "$SHA" \
            --image "khulnasoft/actions-$ACTION:$VERSION=$DIGEST" \
            --image "ghcr.io/khulnasoft/actions/$ACTION:$VERSION=$DIGEST" \
            --sbom "sbom-$ACTION.spdx.json" \
            --run-url "$RUN_URL" \
            --output "release-manifest-$ACTION.json"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ needs.prepare.outputs.action }}
          path: |
            release-manifest-${{ needs.prepare.outputs.action }}.json
            sbom-${{ needs.prepare.outputs.action }}.spdx.json
          if-no-files-found: error
          retention-days: 90

  tag-and-release:
    name: Create tag & GitHub Release
    needs: [prepare, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # zizmor: ignore[artipacked]  # credentials required to push
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643ad5814036f1f03b3c8e958c58 # v2.3.2
        with:
          tag_name: ${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.action }} v${{ needs.prepare.outputs.version }}
          generate_release_notes: true

  verify:
    name: Verify tag, commit, and images
    needs: [prepare, build-and-publish, tag-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c23212 # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Git tag points at release commit
        env:
          TAG: ${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}")
          test "$TAG_SHA" = "$SHA"
          echo "Tag ${TAG} points at release commit ${SHA}."

      - name: Verify published image digests
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.build-and-publish.outputs.digest }}
        run: |
          set -euo pipefail
          for IMG in \
            "khulnasoft/actions-${ACTION}:${VERSION}" \
            "ghcr.io/khulnasoft/actions/${ACTION}:${VERSION}"; do
            MATCHED=0
            for attempt in 1 2 3 4 5; do
              if OUT=$(docker buildx imagetools inspect "$IMG" 2>&1) && \
                 echo "$OUT" | grep -q "$DIGEST"; then
                MATCHED=1
                break
              fi
              echo "Attempt $attempt for $IMG did not match yet; retrying in 15s..."
              sleep 15
            done
            if [ "$MATCHED" != "1" ]; then
              echo "ERROR: $IMG digest does not match pushed digest $DIGEST" >&2
              echo "$OUT" >&2
              exit 1
            fi
            echo "$IMG matches pushed digest ${DIGEST}."
          done
          echo "Images published for ${ACTION}:${VERSION} match digest ${DIGEST}."

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.prepare.outputs.action }}
          path: release-assets

      - name: Independent release verification
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/verify_release.py \
            --action "$ACTION" \
            --version "$VERSION" \
            --expect-commit "$SHA" \
            --manifest "release-assets/release-manifest-$ACTION.json" \
            --attest

  release-assets:
    name: Attach manifest & SBOM to release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.prepare.outputs.action }}
          path: release-assets

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643ad5814036f1f03b3c8e958c58 # v2.3.2
        with:
          tag_name: ${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}
          files: release-assets/*
