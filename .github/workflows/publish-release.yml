name: Publish Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to release"
        required: true
        type: choice
        options:
          - issue-manager
          - label-approved
          - latest-changes
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      action: ${{ steps.prepare.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Prepare release
        id: prepare
        run: |
          python scripts/prepare_release.py prepare --action ${{ inputs.action }} --bump ${{ inputs.bump }}
          VERSION=$(python scripts/prepare_release.py current --action ${{ inputs.action }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "action=${{ inputs.action }}" >> $GITHUB_OUTPUT

      - name: Validate
        run: |
          python scripts/prepare_release.py check --action ${{ inputs.action }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.action }}/version.txt ${{ inputs.action }}/Dockerfile ${{ inputs.action }}/README.md
          git commit -m "chore(${{ inputs.action }}): release v${{ steps.prepare.outputs.version }}"
          git push

  build-and-publish:
    name: Build & publish image
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c23212 # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./${{ needs.prepare.outputs.action }}
          file: ./${{ needs.prepare.outputs.action }}/base.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            khulnasoft/actions-${{ needs.prepare.outputs.action }}:${{ needs.prepare.outputs.version }}
            ghcr.io/khulnasoft/actions/${{ needs.prepare.outputs.action }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  tag-and-release:
    name: Create tag & GitHub Release
    needs: [prepare, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643ad5814036f1f03b3c8e958c58 # v2.3.2
        with:
          tag_name: ${{ needs.prepare.outputs.action }}/v${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.action }} v${{ needs.prepare.outputs.version }}
          generate_release_notes: true

