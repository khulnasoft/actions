name: Container Build (no push)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build for the reproducibility check"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.action }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: [issue-manager, label-approved, latest-changes, pr-push, pr-submit]
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build (no push)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./${{ matrix.action }}/base.dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: actions-smoke-${{ matrix.action }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: matrix.platform == 'linux/amd64'
        env:
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            issue-manager) SMOKE_IMPORT="app.main" ;;
            label-approved) SMOKE_IMPORT="label_approved.__main__" ;;
            latest-changes) SMOKE_IMPORT="latest_changes.main" ;;
            pr-push) SMOKE_IMPORT="pr_push.main" ;;
            pr-submit) SMOKE_IMPORT="pr_submit.main" ;;
            *) echo "Unknown action: $ACTION" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint python "actions-smoke-${ACTION}:latest" \
            -c "import $SMOKE_IMPORT; print('smoke ok:', '$SMOKE_IMPORT')"

  repro-check:
    name: Reproducibility check (${{ matrix.action }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action: [issue-manager, label-approved, latest-changes, pr-push, pr-submit]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build twice without cache
        env:
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            docker buildx build \
              --file "$ACTION/base.dockerfile" \
              --platform linux/amd64 \
              --no-cache \
              --load \
              --tag "repro-$ACTION-$attempt:latest" \
              .
            docker inspect --format '{{.Id}} {{json .RootFS.Layers}}' \
              "repro-$ACTION-$attempt:latest" > "layers-$attempt.txt"
          done

      - name: Compare layer digests
        env:
          ACTION: ${{ matrix.action }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -uo pipefail
          ID1=$(cut -d' ' -f1 layers-1.txt)
          ID2=$(cut -d' ' -f1 layers-2.txt)
          LAYERS1=$(cut -d' ' -f2- layers-1.txt)
          LAYERS2=$(cut -d' ' -f2- layers-2.txt)
          {
            echo "### Reproducibility: $ACTION @ $REF"
            echo
            echo "- Image ID build 1: \`$ID1\`"
            echo "- Image ID build 2: \`$ID2\`"
            if [ "$LAYERS1" = "$LAYERS2" ]; then
              echo "- RootFS layer diff_ids: **identical**"
              echo
              echo "Layers are reproducible for this ref; image config"
              echo "timestamps may still differ, so registry digests can vary."
            else
              echo "- RootFS layer diff_ids: **differ**"
              echo
              echo "Layer content is not bit-for-bit reproducible for this ref"
              echo "(expected while the base image tag floats and pip resolves"
              echo "versions at build time). See docs/provenance.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
