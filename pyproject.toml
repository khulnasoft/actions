[tool.ruff]
target-version = "py313"
line-length = 100
src = ["issue-manager", "label-approved", "latest-changes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "label_approved", "latest_changes"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
files = ["issue-manager", "label-approved", "latest-changes"]

[tool.pytest.ini_options]
testpaths = ["issue-manager/tests", "label-approved/tests", "latest-changes/tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["issue-manager", "label-approved", "latest-changes"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
