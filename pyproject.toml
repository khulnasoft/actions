[tool.ruff]
target-version = "py314"
line-length = 100
src = ["issue-manager", "label-approved", "latest-changes", "pr-push", "pr-submit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "label_approved", "latest_changes", "pr_push", "pr_submit"]

[tool.ruff.lint.per-file-ignores]
"latest-changes/tests/test_generate_content.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
files = ["issue-manager", "label-approved", "latest-changes", "pr-push", "pr-submit"]
exclude = ["(?x)(^|/)tests/"]

[tool.pytest.ini_options]
addopts = "-ra -q --import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["issue-manager", "label-approved", "latest-changes", "pr-push", "pr-submit"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
